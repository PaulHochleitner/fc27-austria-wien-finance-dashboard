<!doctype html>
<html lang="de-AT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Veilchen-Kassa · FC27 Transferbudget</title>
  <meta name="description" content="Hausregel-Rechner für das Ingame-Transferbudget im FC27-Karrieremodus mit dem FK Austria Wien.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#24103F">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 46'%3E%3Cpath d='M20 1 38 7v15c0 11-8 19-18 23C10 41 2 33 2 22V7z' fill='%234E2A84' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M20 6v34' stroke='%23fff' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#main">Zum Inhalt springen</a>

  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 40 46" aria-hidden="true">
        <path d="M20 1 38 7v15c0 11-8 19-18 23C10 41 2 33 2 22V7z" fill="#4E2A84" stroke="#fff" stroke-width="2"/>
        <path d="M20 5.5v35" stroke="#fff" stroke-width="6"/>
        <path d="M20 1 38 7v15c0 11-8 19-18 23C10 41 2 33 2 22V7z" fill="none" stroke="#fff" stroke-width="2"/>
      </svg>
      <div>
        <strong>Veilchen-Kassa</strong>
        <span>FK Austria Wien · Karrieremodus FC27</span>
      </div>
    </div>
    <nav class="tabs" aria-label="Hauptnavigation">
      <button type="button" data-nav="dashboard">Übersicht</button>
      <button type="button" data-nav="verkauf">Verkauf</button>
      <button type="button" data-nav="kauf">Kauf</button>
      <button type="button" data-nav="events">Events</button>
      <button type="button" data-nav="aktionen">Aktionen</button>
      <button type="button" data-nav="saison">Neue Saison</button>
      <button type="button" data-nav="protokoll">Protokoll</button>
    </nav>
    <div class="top-actions">
      <span id="saveState" class="save-state" aria-live="polite"></span>
      <button type="button" class="icon-btn" data-nav="einstellungen" id="settingsBtn" aria-label="Einstellungen" title="Einstellungen"></button>
      <button type="button" id="themeBtn" class="icon-btn" aria-label="Farbmodus wechseln" title="Farbmodus wechseln"></button>
    </div>
  </header>

  <main id="main">
    <section class="view" id="view-dashboard" aria-label="Übersicht"></section>
    <section class="view" id="view-verkauf" aria-label="Verkauf eintragen"></section>
    <section class="view" id="view-kauf" aria-label="Kauf eintragen"></section>
    <section class="view" id="view-events" aria-label="Saison-Events"></section>
    <section class="view" id="view-aktionen" aria-label="Aktionen"></section>
    <section class="view" id="view-saison" aria-label="Neue Saison starten"></section>
    <section class="view" id="view-protokoll" aria-label="Protokoll"></section>
    <section class="view" id="view-einstellungen" aria-label="Einstellungen"></section>
  </main>

  <nav class="bottom-nav" aria-label="Navigation mobil">
    <button type="button" data-nav="dashboard"><i data-icon="home"></i>Übersicht</button>
    <button type="button" data-nav="verkauf"><i data-icon="sell"></i>Verkauf</button>
    <button type="button" data-nav="kauf"><i data-icon="buy"></i>Kauf</button>
    <button type="button" data-nav="events"><i data-icon="calendar"></i>Events</button>
    <button type="button" data-nav="protokoll"><i data-icon="list"></i>Protokoll</button>
  </nav>

  <dialog id="dialog" aria-labelledby="dlgTitle"></dialog>
  <div class="toast-host" id="toasts" role="status" aria-live="polite"></div>
  <div class="chart-tip" id="chartTip" hidden></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="js/app.js"></script>
</body>
</html>
